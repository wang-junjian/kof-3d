name: Deploy playable demo

# 仓库只提交源码：可玩的 kof-3d.html 是构建产物（.gitignore 忽略），
# 由本工作流在每次 push 到 main 时重新构建并发布成 Pages 的 index.html。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只允许一个部署在跑，且不取消进行中的部署（避免站点短暂空档）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

      # 防「源码改了产物没重建」+ 防非确定性构建。产物由 .gitignore 忽略、本就不入库，
      # 因此 git diff --exit-code 只检查被跟踪文件：build 不得改动任何源码 / 配置。
      - name: Build reproducibility & tracked-files guard
        run: |
          sha256sum dist/game.js dist/game.css kof-3d.html kof-3d-vrm.html > /tmp/h1
          npm run build
          sha256sum dist/game.js dist/game.css kof-3d.html kof-3d-vrm.html > /tmp/h2
          diff -u /tmp/h1 /tmp/h2
          git diff --exit-code

      # 浏览器端 112 条自检：CI 显式提供 Chrome（verify.mjs 支持 CHROME_PATH，
      # 且会用 fs.existsSync 逐个探测，CHROME_PATH 无效时自动回退到预装 Chrome）。
      # 轻量门禁可把下一行换成 `npm run smoke`。
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Browser self-check (112 checks)
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run verify
      - name: Upload shots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-shots
          path: shots/
          if-no-files-found: ignore

      - name: Assemble offline single-file site
        run: |
          mkdir -p site
          cp kof-3d.html site/index.html
          cp kof-3d.html site/kof-3d.html
          touch site/.nojekyll
          printf 'Playable build of commit %s\n' "$GITHUB_SHA" > site/build.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
